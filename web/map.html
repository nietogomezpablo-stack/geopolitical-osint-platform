<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Geopolitical OSINT Platform</title>

    <link
        rel="stylesheet"
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    >

    <style>
        html,
        body {
            margin: 0;
            height: 100%;
            font-family: Arial, sans-serif;
            background: #111827;
        }

        #map {
            height: 100%;
            width: 100%;
        }

        .panel {
            position: absolute;
            top: 20px;
            right: 20px;
            z-index: 1000;
            width: 320px;
            padding: 20px;
            background: rgba(17, 24, 39, 0.95);
            color: white;
            border-radius: 10px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.35);
        }

        .panel h1 {
            margin: 0 0 5px 0;
            font-size: 22px;
        }

        .subtitle {
            color: #9ca3af;
            margin-bottom: 20px;
        }

        .navigation {
            margin-bottom: 20px;
        }

        .navigation a {
            color: white;
            text-decoration: none;
            background: #374151;
            padding: 8px 12px;
            border-radius: 5px;
            display: inline-block;
        }

        .stats {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 20px;
        }

        .stat {
            background: #1f2937;
            padding: 12px;
            border-radius: 8px;
        }

        .stat-value {
            display: block;
            font-size: 20px;
            font-weight: bold;
        }

        .stat-label {
            display: block;
            margin-top: 3px;
            color: #9ca3af;
            font-size: 12px;
        }

        .filters {
            border-top: 1px solid #374151;
            padding-top: 15px;
        }

        .filters label {
            display: block;
            margin-bottom: 5px;
            font-size: 13px;
            color: #d1d5db;
        }

        .filters select {
            width: 100%;
            margin-bottom: 12px;
            padding: 8px;
            background: #1f2937;
            color: white;
            border: 1px solid #374151;
            border-radius: 5px;
        }

        .status {
            margin-top: 10px;
            color: #9ca3af;
            font-size: 12px;
        }
    </style>
</head>

<body>

<div id="map"></div>

<div class="panel">
    <h1>Geopolitical OSINT Platform</h1>

    <div class="subtitle">
        Geopolitical OSINT Platform
    </div>

    <div class="navigation">
        <a href="/graph">
            Abrir Knowledge Graph
        </a>
    </div>

    <div class="stats">
        <div class="stat">
            <span
                class="stat-value"
                id="total-events"
            >
                -
            </span>

            <span class="stat-label">
                Eventos
            </span>
        </div>

        <div class="stat">
            <span
                class="stat-value"
                id="geo-events"
            >
                -
            </span>

            <span class="stat-label">
                Geolocalizados
            </span>
        </div>

        <div class="stat">
            <span
                class="stat-value"
                id="total-entities"
            >
                -
            </span>

            <span class="stat-label">
                Entidades
            </span>
        </div>

        <div class="stat">
            <span
                class="stat-value"
                id="total-sources"
            >
                -
            </span>

            <span class="stat-label">
                Artículos
            </span>
        </div>
    </div>

    <div class="filters">
        <label for="country-filter">
            País
        </label>

        <select id="country-filter">
            <option value="">
                Todos
            </option>

            <option value="Niger">
                Niger
            </option>
        </select>

        <label for="type-filter">
            Tipo de evento
        </label>

        <select id="type-filter">
            <option value="">
                Todos
            </option>

            <option value="armed_attack">
                Armed attack
            </option>

            <option value="claim_responsibility">
                Claim responsibility
            </option>
        </select>
    </div>

    <div
        class="status"
        id="status"
    >
        Conectando con API...
    </div>
</div>

<script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js">
</script>

<script>
    const map = L.map("map").setView(
        [17.5, 8.0],
        5
    );

    L.tileLayer(
        "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
        {
            attribution: "&copy; OpenStreetMap contributors"
        }
    ).addTo(map);

    const eventLayer = L.layerGroup().addTo(map);

    function loadStats() {
        fetch("/api/stats")
            .then(response => response.json())
            .then(data => {
                document.getElementById(
                    "total-events"
                ).textContent = data.events;

                document.getElementById(
                    "geo-events"
                ).textContent =
                    data.geolocated_events;

                document.getElementById(
                    "total-entities"
                ).textContent =
                    data.entities;

                document.getElementById(
                    "total-sources"
                ).textContent =
                    data.sources;
            });
    }

    function loadEvents() {
        const country =
            document.getElementById(
                "country-filter"
            ).value;

        const eventType =
            document.getElementById(
                "type-filter"
            ).value;

        const parameters =
            new URLSearchParams();

        if (country) {
            parameters.append(
                "country",
                country
            );
        }

        if (eventType) {
            parameters.append(
                "type",
                eventType
            );
        }

        let url = "/api/events";

        if (parameters.toString()) {
            url += "?" + parameters.toString();
        }

        document.getElementById(
            "status"
        ).textContent = "Cargando eventos...";

        fetch(url)
            .then(response => {
                if (!response.ok) {
                    throw new Error("API error");
                }

                return response.json();
            })
            .then(data => {
                eventLayer.clearLayers();

                const markers = [];

                const geolocatedEvents =
                    data.events.filter(
                        event =>
                            event.latitude !== null &&
                            event.longitude !== null
                    );

                geolocatedEvents.forEach(event => {
                    const marker =
                        L.circleMarker(
                            [
                                event.latitude,
                                event.longitude
                            ],
                            {
                                radius: 8,
                                weight: 2,
                                fillOpacity: 0.8
                            }
                        );

                    marker.bindPopup(`
                        <strong>${event.title}</strong>

                        <br><br>

                        <strong>Fecha:</strong>
                        ${event.event_date}

                        <br>

                        <strong>Tipo:</strong>
                        ${event.event_type}

                        <br>

                        <strong>País:</strong>
                        ${event.country}

                        <br>

                        <strong>Lugar:</strong>
                        ${event.location}

                        <br>

                        <strong>Confianza:</strong>
                        ${event.confidence}

                        <br><br>

                        <a
                            href="/api/events/${event.id}"
                            target="_blank"
                        >
                            Ver datos completos
                        </a>
                    `);

                    marker.addTo(eventLayer);

                    markers.push(marker);
                });

                document.getElementById(
                    "status"
                ).textContent =
                    `API conectada · ${data.count} eventos encontrados`;

                if (markers.length > 0) {
                    const group =
                        L.featureGroup(markers);

                    map.fitBounds(
                        group.getBounds().pad(0.3)
                    );
                }
            })
            .catch(error => {
                document.getElementById(
                    "status"
                ).textContent =
                    "Error de conexión con API";

                console.error(error);
            });
    }

    document.getElementById(
        "country-filter"
    ).addEventListener(
        "change",
        loadEvents
    );

    document.getElementById(
        "type-filter"
    ).addEventListener(
        "change",
        loadEvents
    );

    loadStats();
    loadEvents();
</script>

</body>
</html>
